name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: starter-app
        run: flake8 --config=flake8-config.txt .

  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: starter-app
        run: pytest -v