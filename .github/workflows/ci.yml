name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # Exécuter le linting du code Python
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Lint
        working-directory: starter-app
        run: flake8 --config=flake8-config.txt .

  # Exécuter les tests unitaires (pytest)
  test:
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: starter-app
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: starter-app
        run: pytest -v

  # Construire et pousser l'image Docker (sur ghcr.io/<repo>/<commit>)
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: starter-app
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  # Déployer l'application en environnement de production blue green
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      # Changer la couleur du déploiement un run sur deux
      - name: Deploy blue-green environment
        working-directory: starter-app
        run: |
          if (( GITHUB_RUN_NUMBER % 2 == 0 )); then
            echo "DEPLOY_TARGET_COLOR=blue" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_TARGET_COLOR=green" >> "$GITHUB_ENV"
          fi
          chmod +x deploy/deploy.sh
          ./deploy/deploy.sh