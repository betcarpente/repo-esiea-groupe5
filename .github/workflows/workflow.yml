name: my new workflow

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('starter-app2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      
      - name: Create virtual environment
        run: python -m venv venv
      
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r starter-app2/requirements.txt
      
      - name: Run flake8
        run: |
          source venv/bin/activate
          flake8 starter-app2 --max-line-length=100 --exclude=venv

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.9', '3.11']
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('starter-app2/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-
      
      - name: Create virtual environment
        run: python -m venv venv
      
      - name: Install dependencies
        run: |
          source venv/bin/activate
          pip install -r starter-app2/requirements.txt
      
      - name: Run pytest with coverage
        run: |
          source venv/bin/activate
          pytest -v starter-app2 --cov=starter-app2 --cov-report=html
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: htmlcov/

